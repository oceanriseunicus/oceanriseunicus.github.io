<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{app} – Login</title>
  <meta name="description" content="ORUS Portal – secure Admin & Trainer login for Oceanrise Unicus." />
  <link rel="icon" href="../assets/images/Logo.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">

  <!-- Navbar (links are filled by js/layout.js) -->
  <header class="topbar">
    <div class="nav">
      <a class="brand" href="../index.html" aria-label="Oceanrise Unicus home">
        <img data-logo alt="Logo" />
        <span><span data-app-name>ORUS Portal</span><small data-tagline>Orders &amp; Training Management</small></span>
      </a>
      <nav class="links" id="links" aria-label="Main navigation"></nav>
      <div class="tools">
        <button class="ib" data-theme-toggle aria-label="Dark / light mode"></button>
        <button class="ib burger" id="bg" aria-label="Menu" aria-expanded="false">☰</button>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card card">
      <div class="auth-brand">
        <img class="auth-logo" data-logo alt="Logo" />
        <h1 data-app-name>ORUS Portal</h1>
        <p class="muted" data-tagline>Orders &amp; Training Management</p>
      </div>

      <!-- Step 1 -->
      <form id="loginForm" autocomplete="on">
        <label class="lbl" for="email">Email</label>
        <input class="input" id="email" type="email" placeholder="you@example.com" required autocomplete="username" />

        <label class="lbl" for="password">Password</label>
        <div class="pass-wrap">
          <input class="input" id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" class="pass-toggle" id="togglePass" aria-label="Show password">
            <svg class="eye-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 20C5 20 1 12 1 12a18.6 18.6 0 0 1 5.1-5.9"/><path d="M9.9 4.2A10.7 10.7 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2"/><path d="M14.1 14.1A3 3 0 1 1 9.9 9.9"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>

        <p class="form-error" id="err1" role="alert"></p>
        <button class="btn btn-block" id="loginBtn" type="submit">Login</button>
        <p class="muted center small">Admin &amp; Trainer login. A one-time code will be sent to your email.</p>
      </form>

      <!-- Step 2 -->
      <form id="codeForm" class="hidden" autocomplete="off">
        <p class="center muted">We sent a 6-character code to<br><b id="sentTo"></b></p>
        <input class="input code-input" id="code" type="text" maxlength="6" placeholder="••••••" required
               autocapitalize="off" autocorrect="off" spellcheck="false" />
        <p class="form-error" id="err2" role="alert"></p>
        <button class="btn btn-block" id="verifyBtn" type="submit">Verify &amp; Continue</button>
        <button class="btn o btn-block" id="backBtn" type="button">Back</button>
      </form>
    </section>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
